# ==============================================================================
# Nginx 生产环境 443 端口 SNI 四层智能分流 + 面板七层 HTTPS 反代配置样例
# ==============================================================================
# 说明：
# 1. 四层 stream 在 443 端口开启 proxy_protocol on; 以保留真实访客 IP；
# 2. 面板域名直转本地七层 127.0.0.1:8443 (启用 proxy_protocol + real_ip 解析真实访客 IP)；
# 3. Xray REALITY 默认未开启 sockopt.acceptProxyProtocol，因此经由本机 127.0.0.1:8444
#    中转剥离 PROXY protocol 头后再原样透传纯 TLS 字节流至 127.0.0.1:4434，避免握手失败。
#    (若后续在 Xray REALITY 入站显式开启了 sockopt.acceptProxyProtocol: true，可直接改为指向 xray_reality_node。)

# 1. 四层 Stream 模块：在 443 端口进行 SNI 预读取并分流
stream {
    # 启用 SNI 探测
    map $ssl_preread_server_name $backend_upstream {
        # Reality 伪装目标 SNI 域名（经 8444 剥离 PROXY protocol 后透传给默认 Xray 节点）
        reality.example.com    xray_reality_relay;

        # 面板公网访问域名（携带 PROXY protocol 直转本地 Nginx HTTPS 七层服务）
        panel.example.com      nginx_web_tls;

        # 其他未匹配流量（直接探测 IP、空 SNI 或恶意扫描）全部兜底转给 Xray Reality 伪装节点，绝不泄露面板证书
        default                xray_reality_relay;
    }

    # Xray 本地后端节点（对应面板中配置的内部监听端口，默认未开启 acceptProxyProtocol）
    upstream xray_reality_node {
        server 127.0.0.1:4434;
    }

    # 本地中转上游（接收并剥离 PROXY protocol，不破坏默认未开启 acceptProxyProtocol 的 Xray REALITY 入站）
    upstream xray_reality_relay {
        server 127.0.0.1:8444;
    }

    # Nginx 本地七层 HTTPS 服务
    upstream nginx_web_tls {
        server 127.0.0.1:8443;
    }

    # 外部 443 入口：读取 SNI 并在转发时统一附加 PROXY protocol v1 头携带真实客户端 IP
    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        ssl_preread on; # 关键：开启 SNI 预读无需解密 TLS
        proxy_protocol on;
        proxy_pass $backend_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }

    # 本地 8444 剥离中转：接收 443 发来的 PROXY protocol 头并剥离，以纯 TCP 透传给 Xray REALITY
    server {
        listen 127.0.0.1:8444 proxy_protocol;
        proxy_pass xray_reality_node;
        proxy_protocol off;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}

# 2. 七层 HTTP/HTTPS 服务：反代 Xray Decoupled Panel 面板
http {
    # 按需升级 WebSocket 连接；普通 HTTP 请求清空 Connection 以配合 upstream keepalive 复用长连接
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 面板后端上游连接池（保持长连接，降低本地 TCP 握手开销）
    upstream panel_backend {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    # 静态资产与 JSON 响应压缩（大幅减小 JS/CSS 与订阅文本传输体积）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 80 端口强制跳转 443
    server {
        listen 80;
        server_name panel.example.com;
        return 301 https://$host$request_uri;
    }

    # 本地 8443 端口接收从 Stream 分流过来的面板请求（解析 PROXY protocol 还原真实访客 IP）
    server {
        listen 127.0.0.1:8443 ssl http2 proxy_protocol;
        server_name panel.example.com;

        # 仅信任本机 Stream 转发过来的 PROXY protocol 头，将 $remote_addr 还原为真实访客 IP
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        # 【若面板前端套用 Cloudflare CDN（Orange Cloud）】：
        # 1) 请将上方 real_ip_header 改为 CF-Connecting-IP，并将 set_real_ip_from 替换为 Cloudflare 官方回源 IPv4/IPv6 CIDR；
        # 2) 同时可在下方 location 中改为：proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # 未套用 Cloudflare 时，必须保持下方的清空策略，防止攻击者伪造 CF-Connecting-IP 绕过面板限流。

        # SSL 证书配置
        ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 反向代理到 Panel 后端
        location / {
            proxy_pass http://panel_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # 默认清空外部伪造的 CF-Connecting-IP（套用 Cloudflare 时按上方注释放行）
            proxy_set_header CF-Connecting-IP "";
        }

        # 订阅链接直接透传
        location /sub/ {
            proxy_pass http://panel_backend/sub/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # 默认清空外部伪造的 CF-Connecting-IP（套用 Cloudflare 时按上方注释放行）
            proxy_set_header CF-Connecting-IP "";
        }
    }
}
