syntax = "proto3";

package xray.panel.protocol;
option go_package = "panel/internal/adapter/xray/proto;proto";

import "serial.proto";

enum SecurityType {
  UNKNOWN = 0;
  AUTO = 2;
  AES128_GCM = 3;
  CHACHA20_POLY1305 = 4;
  NONE = 5;
  ZERO = 6;
}

message SecurityConfig {
  SecurityType type = 1;
}

message User {
  uint32 level = 1;
  string email = 2;
  xray.panel.serial.TypedMessage account = 3;
}
