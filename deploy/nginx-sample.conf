# ==============================================================================
# Nginx 生产环境 443 端口 SNI 四层智能分流 + 面板七层 HTTPS 反代配置样例
# ==============================================================================

# 1. 四层 Stream 模块：在 443 端口进行 SNI 预读取并分流
stream {
    # 启用 SNI 探测
    map $ssl_preread_server_name $backend_upstream {
        # Reality 伪装目标 SNI 域名（直接透传给 Xray 本地 TCP/XHTTP 节点）
        www.titech.ac.jp       xray_reality_node;
        
        # 面板公网访问域名（分流给本地 Nginx HTTPS 七层服务）
        panel.yourdomain.com   nginx_web_tls;
        
        # 其他未匹配流量默认转发给普通 Web 或 Xray
        default                nginx_web_tls;
    }

    # Xray 本地后端节点
    upstream xray_reality_node {
        server 127.0.0.1:4434; # 对应面板中配置的内部监听端口
    }

    # Nginx 本地七层 HTTPS 服务
    upstream nginx_web_tls {
        server 127.0.0.1:8443;
    }

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        proxy_pass $backend_upstream;
        ssl_preread on; # 关键：开启 SNI 预读无需解密 TLS
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}

# 2. 七层 HTTP/HTTPS 服务：反代 Xray Decoupled Panel 面板
http {
    # 80 端口强制跳转 443
    server {
        listen 80;
        server_name panel.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    # 本地 8443 端口接收从 Stream 分流过来的面板请求
    server {
        listen 127.0.0.1:8443 ssl http2;
        server_name panel.yourdomain.com;

        # SSL 证书配置
        ssl_certificate     /etc/letsencrypt/live/panel.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/panel.yourdomain.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 反向代理到 Panel 后端
        location / {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 订阅链接直接透传
        location /sub/ {
            proxy_pass http://127.0.0.1:9000/sub/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
