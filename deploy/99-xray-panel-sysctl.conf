# ==============================================================================
# Xray Decoupled Panel - Linux 内核网络栈可选调优基线 (BBR + QUIC/UDP 缓冲区)
# ==============================================================================
# 适用场景：独立 VPS / 物理机（Linux Kernel >= 4.9，非受限容器环境）。
# 启用方式（非破坏性，按需手动应用）：
#   sudo cp deploy/99-xray-panel-sysctl.conf /etc/sysctl.d/99-xray-panel-sysctl.conf
#   sudo sysctl --system
# 验证生效：
#   sysctl net.ipv4.tcp_congestion_control net.core.default_qdisc net.core.rmem_max net.core.wmem_max
# ==============================================================================

# 1. 启用 FQ 队列调度与 BBR 拥塞控制，提升长肥管道与弱网丢包下的 TCP 吞吐与首包延迟
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 2. 扩大内核 Socket 收发缓冲区上限（16 MiB），满足 QUIC / Hysteria2 / XHTTP 高并发 UDP 突发需求
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# 3. TCP 自动调优收发窗口（min / default / max，单位字节）
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
